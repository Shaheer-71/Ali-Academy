<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="s_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#263f4d"/>
      <stop offset="100%" stop-color="#1F3F4A"/>
    </linearGradient>
    <!-- Flame gradient -->
    <linearGradient id="s_flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#A4C400"/>
      <stop offset="55%"  stop-color="#d8f020"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Book page left -->
    <linearGradient id="s_pgL" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#f9fcf9"/>
      <stop offset="100%" stop-color="#e4ede6"/>
    </linearGradient>
    <!-- Book page right -->
    <linearGradient id="s_pgR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f9fcf9"/>
      <stop offset="100%" stop-color="#e4ede6"/>
    </linearGradient>
    <!-- Logo drop shadow -->
    <filter id="s_shad">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <!-- Flame glow -->
    <filter id="s_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Logo drop shadow wrapper -->
    <filter id="logo_shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <!-- Top line gradient -->
    <linearGradient id="topline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="40%"  stop-color="#A4C400"/>
      <stop offset="60%"  stop-color="#A4C400"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1" fill="rgba(255,255,255,0.035)"/>
    </pattern>
  </defs>

  <!-- ── Background ── -->
  <rect width="390" height="844" fill="#1F3F4A"/>

  <!-- ── Grid overlay ── -->
  <rect width="390" height="844" fill="url(#grid)" opacity="1"/>

  <!-- ── Decor circles ── -->
  <!-- top-left: 200×200, offset -50,-50 -->
  <circle cx="-50" cy="-50" r="100" fill="rgba(164,196,0,0.08)"/>
  <!-- bottom-right: 160×160, offset bottom-30 right-30 -->
  <circle cx="420" cy="874" r="80" fill="rgba(164,196,0,0.08)"/>
  <!-- top-right: 100×100, top 8% right 6% -->
  <circle cx="361" cy="67" r="50" fill="rgba(164,196,0,0.05)"/>
  <!-- bottom-left: 80×80, bottom 18% left 4% -->
  <circle cx="16" cy="692" r="40" fill="rgba(164,196,0,0.05)"/>

  <!-- ── Top accent line ── -->
  <rect x="0" y="0" width="390" height="3" fill="url(#topline)"/>

  <!-- ══════════════════════════
       SECTION 1 — LOGO
       padding-top ≈ 56px (8vh of 844 ≈ 67, clamped to 64, use 56)
  ══════════════════════════ -->
  <!-- Logo centered at x=195, top=56 -->
  <g filter="url(#logo_shadow)">
    <g transform="translate(115, 56)">
      <!-- SVG logo: viewBox 0 0 500 500, width=160, height=160 → scale=0.32 -->
      <g transform="scale(0.32)">
        <circle cx="250" cy="254" r="226" fill="#142e38" opacity="0.18" filter="url(#s_shad)"/>
        <circle cx="250" cy="250" r="226" fill="#A4C400"/>
        <circle cx="250" cy="250" r="216" fill="white"/>
        <circle cx="250" cy="250" r="207" fill="url(#s_bg)"/>
        <circle cx="250" cy="250" r="207" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
        <circle cx="250" cy="250" r="184" fill="none" stroke="#A4C400" stroke-width="2.5" opacity="0.6"/>
        <!-- Curved text -->
        <text x="163.4" y="394.0" transform="rotate(31.0,163.4,394.0)"  font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">L</text>
        <text x="170.8" y="398.1" transform="rotate(28.1,170.8,398.1)"  font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">E</text>
        <text x="178.4" y="402.0" transform="rotate(25.2,178.4,402.0)"  font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">A</text>
        <text x="186.1" y="405.4" transform="rotate(22.3,186.1,405.4)"  font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">R</text>
        <text x="194.1" y="408.4" transform="rotate(19.4,194.1,408.4)"  font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">N</text>
        <text x="209.2" y="413.0" transform="rotate(14.1,209.2,413.0)"  font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">·</text>
        <text x="224.6" y="416.1" transform="rotate(8.7,224.6,416.1)"   font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">D</text>
        <text x="233.0" y="417.1" transform="rotate(5.8,233.0,417.1)"   font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">I</text>
        <text x="241.5" y="417.8" transform="rotate(2.9,241.5,417.8)"   font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">S</text>
        <text x="250.0" y="418.0" transform="rotate(0.0,250.0,418.0)"   font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">C</text>
        <text x="258.5" y="417.8" transform="rotate(-2.9,258.5,417.8)"  font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">O</text>
        <text x="267.0" y="417.1" transform="rotate(-5.8,267.0,417.1)"  font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">V</text>
        <text x="275.4" y="416.1" transform="rotate(-8.7,275.4,416.1)"  font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">E</text>
        <text x="283.8" y="414.6" transform="rotate(-11.6,283.8,414.6)" font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">R</text>
        <text x="299.0" y="410.7" transform="rotate(-17.0,299.0,410.7)" font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">·</text>
        <text x="313.9" y="405.4" transform="rotate(-22.3,313.9,405.4)" font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">L</text>
        <text x="321.6" y="402.0" transform="rotate(-25.2,321.6,402.0)" font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">E</text>
        <text x="329.2" y="398.1" transform="rotate(-28.1,329.2,398.1)" font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">A</text>
        <text x="336.6" y="394.0" transform="rotate(-31.0,336.6,394.0)" font-family="Trebuchet MS,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A4C400" text-anchor="middle">D</text>
        <!-- Dot separators on ring -->
        <circle cx="66"  cy="250" r="4" fill="#A4C400"/>
        <circle cx="434" cy="250" r="4" fill="#A4C400"/>
        <circle cx="66"  cy="250" r="2" fill="white" opacity="0.6"/>
        <circle cx="434" cy="250" r="2" fill="white" opacity="0.6"/>
        <!-- Candle + book group -->
        <g transform="translate(250,190) scale(0.75)">
          <ellipse cx="0" cy="-102" rx="13" ry="18" fill="rgba(164,196,0,0.2)" filter="url(#s_glow)"/>
          <path d="M 0,-76 C -13,-86 -15,-104 -5,-118 C -2,-124 0,-127 0,-76 Z" fill="url(#s_flame)"/>
          <path d="M 0,-76 C  13,-86  15,-104  5,-118 C  2,-124 0,-127 0,-76 Z" fill="url(#s_flame)"/>
          <path d="M 0,-79 C -6,-90 -6,-107 0,-120 C 6,-107 6,-90 0,-79 Z" fill="white" opacity="0.7"/>
          <rect x="-5" y="-76" width="10" height="36" rx="4" fill="#A4C400"/>
          <rect x="-5" y="-66" width="10" height="2.5" rx="1" fill="rgba(255,255,255,0.4)"/>
          <rect x="-5" y="-58" width="10" height="2.5" rx="1" fill="rgba(255,255,255,0.4)"/>
          <path d="M -10,-76 L -12,-62 L 12,-62 L 10,-76 Z" fill="#7a9200"/>
          <ellipse cx="0" cy="-62" rx="12" ry="4" fill="#A4C400"/>
          <ellipse cx="0" cy="67" rx="82" ry="7" fill="rgba(0,0,0,0.18)"/>
          <!-- Left page -->
          <path d="M 0,-44 C -28,-50 -70,-46 -80,-42 L -80,56 C -70,60 -28,62 0,58 Z" fill="url(#s_pgL)"/>
          <rect x="-7" y="-44" width="7" height="102" fill="rgba(0,0,0,0.06)"/>
          <line x1="-70" y1="-28" x2="-10" y2="-30" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1="-70" y1="-17" x2="-10" y2="-19" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1="-70" y1=" -6" x2="-10" y2=" -8" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1="-70" y1="  5" x2="-10" y2="  3" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1="-70" y1=" 16" x2="-10" y2=" 14" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1="-70" y1=" 27" x2="-10" y2=" 25" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <rect x="-70" y="-41" width="56" height="5" rx="2.5" fill="#A4C400" opacity="0.8"/>
          <!-- Right page -->
          <path d="M 0,-44 C  28,-50  70,-46  80,-42 L  80,56 C  70,60  28,62 0,58 Z" fill="url(#s_pgR)"/>
          <rect x="0" y="-44" width="7" height="102" fill="rgba(0,0,0,0.06)"/>
          <line x1=" 10" y1="-30" x2=" 70" y2="-28" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1=" 10" y1="-19" x2=" 70" y2="-17" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1=" 10" y1=" -8" x2=" 70" y2=" -6" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1=" 10" y1="  3" x2=" 70" y2="  5" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1=" 10" y1=" 14" x2=" 70" y2=" 16" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <line x1=" 10" y1=" 25" x2=" 70" y2=" 27" stroke="#1F3F4A" stroke-width="1.6" opacity="0.11"/>
          <rect x="14" y="-41" width="56" height="5" rx="2.5" fill="#A4C400" opacity="0.8"/>
          <!-- Spine -->
          <path d="M -5,-46 Q 0,-50 5,-46 L 5,60 Q 0,64 -5,60 Z" fill="#A4C400"/>
          <line x1="0" y1="-50" x2="0" y2="64" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
          <!-- Binding left -->
          <rect x="-88" y="-46" width="11" height="108" rx="3" fill="#A4C400"/>
          <line x1="-83" y1="-46" x2="-83" y2="62" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
          <!-- Binding right -->
          <rect x="77"  y="-46" width="11" height="108" rx="3" fill="#A4C400"/>
          <line x1="82" y1="-46" x2="82"  y2="62" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
          <path d="M -80,56 Q 0,70 80,56" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
        </g>
        <!-- Horizontal rules around academy name -->
        <rect x="148" y="286" width="204" height="2.5" rx="1.25" fill="#A4C400" opacity="0.8"/>
        <text x="250" y="318" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="white" text-anchor="middle" letter-spacing="5">ALI SCIENCE</text>
        <rect x="185" y="327" width="130" height="1.5" rx="0.75" fill="rgba(255,255,255,0.2)"/>
        <text x="250" y="346" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#A4C400" text-anchor="middle" letter-spacing="9">ACADEMY</text>
        <rect x="148" y="361" width="204" height="2.5" rx="1.25" fill="#A4C400" opacity="0.8"/>
        <!-- Top dot -->
        <circle cx="250" cy="44" r="7"   fill="#A4C400"/>
        <circle cx="250" cy="44" r="3.5" fill="white"/>
      </g>
    </g>
  </g>

  <!-- Brand name: margin-top 14px after logo (logo ends at 56+160=216) -->
  <!-- brand-name: font-size 14, weight 700, white, letter-spacing 2.5px -->
  <text x="195" y="242" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2.5">ALI SCIENCE ACADEMY</text>

  <!-- brand-tagline: font-size 11, weight 400, #A4C400, letter-spacing 1.5px, margin-top 5 -->
  <text x="195" y="261" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#A4C400" text-anchor="middle" letter-spacing="1.5">Learn · Discover · Lead</text>

  <!-- brand-divider: width 40, height 2, bg #A4C400, margin-top 14 -->
  <rect x="175" y="277" width="40" height="2" rx="1" fill="#A4C400"/>

  <!-- ══════════════════════════
       SECTION 2 — WELCOME
       Centered vertically in middle zone (~y=360–410)
  ══════════════════════════ -->
  <!-- welcome-title: font-size 24, weight 800, white, letter-spacing -0.3 -->
  <text x="195" y="380" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.3">Welcome</text>
  <!-- welcome-sub: font-size 11, weight 400, white 45%, margin-top 5 -->
  <text x="195" y="398" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="0.2">Official App of Ali Science Academy</text>

  <!-- ══════════════════════════
       SECTION 3 — AUTHOR
       Positioned in lower-middle area ~y=460
  ══════════════════════════ -->
  <!-- section-label: font-size 10, weight 600, letter-spacing 1.8, uppercase, white 35% -->
  <text x="15" y="455" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.35)" letter-spacing="1.8">FOUNDER</text>

  <!-- author-card: bg #F9FAFB, border #E5E7EB 1px, radius 12, padding 16 18, max-width 360 -->
  <!-- Card: x=15, y=463, width=360, height=78 -->
  <rect x="15" y="463" width="360" height="78" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>

  <!-- avatar: 46x46, circle, bg #1F3F4A, border rgba(164,196,0,0.35) 2px -->
  <!-- avatar center: x=15+18+23=56, y=463+16+23=502 -->
  <circle cx="56" cy="502" r="23" fill="#1F3F4A" stroke="rgba(164,196,0,0.35)" stroke-width="2"/>
  <!-- avatar text "AR": font-size 14, weight 800, white -->
  <text x="56" y="507" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">AR</text>

  <!-- author-name: font-size 13, weight 700, #1F3F4A -->
  <!-- starts after avatar+gap: x = 15+18+46+14+18 = 111, y=490 -->
  <text x="93" y="494" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1F3F4A">Abdul Rafeh Ali</text>
  <!-- author-title: font-size 11, weight 400, #6B7280, margin-top 3 -->
  <text x="93" y="510" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">PhD Scholar · NUST</text>

  <!-- founder-badge: bg #1F3F4A, white, font-size 9, weight 700, letter-spacing 1, radius 6, padding 5 11 -->
  <!-- badge right side: x = 15+360-18-badge_w = ~295, badge_w ~54 -->
  <rect x="295" y="489" width="62" height="24" rx="6" fill="#1F3F4A"/>
  <text x="326" y="505" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">FOUNDER</text>

  <!-- ══════════════════════════
       SECTION 4 — RATING
       ~y=600
  ══════════════════════════ -->
  <!-- 5 stars + score: star width 22, gap 6 -->
  <!-- total width: 5*22 + 4*6 + 6 + ~30 = 170 → start x = (390-170)/2 = 110 -->
  <!-- Stars filled #A4C400 -->
  <g fill="#A4C400">
    <!-- Star 1 -->
    <path transform="translate(100,600) scale(0.917)" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    <!-- Star 2 -->
    <path transform="translate(128,600) scale(0.917)" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    <!-- Star 3 -->
    <path transform="translate(156,600) scale(0.917)" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    <!-- Star 4 -->
    <path transform="translate(184,600) scale(0.917)" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    <!-- Star 5 -->
    <path transform="translate(212,600) scale(0.917)" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
  </g>
  <!-- rating-score: font-size 13, weight 800, white, margin-left 6 -->
  <text x="254" y="615" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0">5.0</text>
  <!-- rating-label: font-size 10, weight 500, white 38%, letter-spacing 1, uppercase -->
  <text x="195" y="643" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.38)" text-anchor="middle" letter-spacing="1">PLAY STORE RATING</text>

  <!-- ══════════════════════════
       BOTTOM BAR
       Full width, at bottom. height ~52px → y=792 to 844
  ══════════════════════════ -->
  <rect x="0" y="792" width="390" height="52" fill="rgba(0,0,0,0.22)"/>
  <line x1="0" y1="792" x2="390" y2="792" stroke="rgba(164,196,0,0.20)" stroke-width="1"/>

  <!-- bottom icon + text centered as a group -->
  <g transform="translate(195, 818)">
    <!-- location pin icon: 13x13, centered left of text -->
    <path transform="translate(-107, -7) scale(0.54)" fill="#A4C400" opacity="0.75"
      d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    <!-- combined text centered at 0 -->
    <text font-family="Arial, sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.2" y="4">
      <tspan font-weight="500" fill="rgba(255,255,255,0.45)">Learning Without Limits,&#160;</tspan><tspan font-weight="700" fill="#A4C400">Anywhere.</tspan>
    </text>
  </g>

</svg>
